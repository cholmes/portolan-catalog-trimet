name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # micromamba env needs a login shell
    steps:
      - uses: actions/checkout@v4

      # GDAL comes from conda-forge, not apt: Ubuntu's gdal-bin is built
      # without the Parquet driver, so `ogr2ogr -f Parquet` fails outright.
      # See environment.yml.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Check the toolchain has what the build needs
        run: |
          ogr2ogr --version
          ogr2ogr --formats | grep -q Parquet || { echo "no Parquet driver"; exit 1; }
          tippecanoe --version
          duckdb -c "select 'duckdb ok'"

      # Node 24 is one of the three ABIs MapLibre Native publishes a prebuilt
      # binary for (v137). Node 23 would fail to install chiitiler. Thumbnails
      # are not rendered in CI, but test_styles.py uses the style-spec package
      # from the same checkout when it is present.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install rashid
        run: pip install rashid

      # The data files are not committed and several tests read them (row
      # counts, checksums, SQL recipes), so rebuild them from TriMet's sources.
      - name: Fetch TriMet sources
        run: python3 tools/fetch.py --data --no-stamp

      - name: Convert
        run: python3 tools/convert.py

      - name: Run tests
        run: python3 tests/run_all.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - run: pyflakes tools/*.py tests/*.py
